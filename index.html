<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIRANA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#FBF3E4;--card:#FFF9EE;--ink:#3E2815;--mut:#7A5C3E;--ac:#7A4A22;--on:#FFF9EE;--bd:#E3D2B5;--hd:#5B3A1F;--hdt:#FBF3E4;--red:#A8402F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2A1D12;--card:#38271A;--ink:#F6E9D2;--mut:#D3B994;--ac:#D9A066;--on:#2A1D12;--bd:#5A4230;--hd:#1F140B;--red:#E58A77}}
:root[data-theme=dark]{--bg:#2A1D12;--card:#38271A;--ink:#F6E9D2;--mut:#D3B994;--ac:#D9A066;--on:#2A1D12;--bd:#5A4230;--hd:#1F140B;--red:#E58A77}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--hd);color:var(--hdt);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header .ghost{color:var(--hdt);border-color:#ffffff55}.logo{letter-spacing:.12em;font-size:1.2rem}.sp{flex:1}.who{display:flex;gap:8px;align-items:center}.who small{display:block;opacity:.8;font-size:.75rem}
nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--card)}
nav button{background:none;color:var(--ink);border:1px solid transparent;white-space:nowrap}nav button.on{background:var(--ac);color:var(--on)}
main{max-width:860px;margin:0 auto;padding:16px}h2{margin:.2em 0 .6em}h3{margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 14px}.warn{border-color:var(--ac)}
button,.btn{background:var(--ac);color:var(--on);border:1px solid var(--ac);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;display:inline-block}
.ghost{background:none;color:var(--ink);border-color:var(--bd)}.bad{background:var(--red);border-color:var(--red);color:#fff}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;margin:0 0 10px;font-weight:600}label input,label select,label textarea{margin-top:4px;font-weight:400}.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>input{flex:1;min-width:140px}.mut{color:var(--mut)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);flex:none}.who .av{width:32px;height:32px;background:#ffffff33;color:var(--hdt)}
.badge{display:inline-block;background:var(--bd);color:var(--ink);border-radius:99px;padding:1px 10px;font-size:.8rem;margin:0 4px 2px 0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
.qr{background:#fff;padding:6px;border-radius:8px;min-height:144px;min-width:144px}.big{font-size:2.4rem;font-weight:700;color:var(--ac)}
.red{border:1.5px solid var(--red);color:var(--red);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600}
.auth{max-width:420px;margin:0 auto;padding:40px 16px}.auth h1{letter-spacing:.14em;margin:0;color:var(--ac)}.tag{color:var(--mut);margin:.2em 0 1.2em}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chat{display:grid;grid-template-columns:200px 1fr;gap:12px}@media(max-width:640px){.chat{grid-template-columns:1fr}}
.chat aside button{display:flex;gap:8px;align-items:center;width:100%;margin-bottom:6px;background:none;color:var(--ink);border-color:var(--bd);text-align:left}.chat aside button.on{background:var(--bd)}
.msgs{min-height:180px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px 0}.m{max-width:80%;padding:7px 12px;border-radius:14px;background:var(--bd)}.m.me{align-self:flex-end;background:var(--ac);color:var(--on)}
fieldset{border:1px solid var(--bd);border-radius:10px;margin:0 0 10px}.ra{display:inline-flex;gap:4px;font-weight:400;margin:0 12px 4px 0}.ra input{width:auto;margin:0}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.dl{width:100%;max-width:400px;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hd);color:var(--hdt);padding:8px 16px;border-radius:99px;z-index:60;display:none}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const L=(()=>{try{localStorage.getItem('x');return localStorage}catch(e){return{getItem:()=>null,setItem(){}}}})();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D,me=null,tab='',reg=null,peer='',tst=null,pend=(location.hash.match(/join-([A-Z0-9]{6})/)||[])[1];
function load(){try{D=JSON.parse(L.getItem('kirana'))}catch(e){}D=D||{};['u','r','mt'].forEach(k=>D[k]=D[k]||{});['m','n','s'].forEach(k=>D[k]=D[k]||[])}
const save=()=>{try{L.setItem('kirana',JSON.stringify(D))}catch(e){toast('Penyimpanan penuh')}};
load();me=D.u[L.getItem('kirana_s')]||null;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const R={gurubk:'Guru BK',siswa:'Siswa',konselor:'Konselor',klien:'Klien Umum'};
const NAV={gurubk:[['room','Ruang'],['jadwal','Jadwal'],['pesan','Pesan'],['meet','Meeting'],['profil','Profil']],siswa:[['rekap','Rekap'],['scan','Scanner'],['tes','Tes'],['pesan','Pesan'],['meet','Meeting'],['profil','Profil']],konselor:[['profil','Profil Publik'],['pesan','Pesan'],['meet','Meeting']],klien:[['cari','Cari Konselor'],['tes','Tes'],['pesan','Pesan'],['meet','Meeting'],['profil','Profil']]};
const av=(u,big)=>u.photo?`<img class=av src="${u.photo}" alt="" ${big?'style="width:64px;height:64px"':''}>`:`<span class=av ${big?'style="width:64px;height:64px"':''}>${esc((u.name||'?')[0])}</span>`;
const pts=u=>100+(u.log||[]).reduce((a,l)=>a+l.v,0);
const all=()=>Object.values(D.u).filter(u=>u.email!=me.email);
const isCs=u=>u.role=='konselor'||(u.role=='gurubk'&&u.cs&&u.cs.on);
const base=()=>location.href.split('#')[0];
const myRooms=()=>Object.values(D.r).filter(r=>r.o==me.email);
const myStudents=()=>[...new Set(myRooms().flatMap(r=>r.s))].map(e=>D.u[e]).filter(Boolean);
function dlg(t,f,cb,msg){const d=document.createElement('div');d.className='ov';d.innerHTML=`<form class="card dl"><h3>${esc(t)}</h3>${msg?`<p class=mut>${esc(msg)}</p>`:''}${f.map(x=>`<label>${esc(x.l)}<input name=${x.k} type=${x.t||'text'} value="${esc(x.v||'')}" required></label>`).join('')}<div class=row><button>OK</button><button type=button class=ghost>Batal</button></div></form>`;document.body.appendChild(d);const fm=d.querySelector('form');fm.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(fm));d.remove();cb(v)};d.querySelector('.ghost').onclick=()=>d.remove()}
function img(file,max,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=Math.min(1,max/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)}
async function callUI(t,v,sub){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="card dl"><h3>${esc(t)}</h3><p class=mut>${esc(sub)}</p><video autoplay muted playsinline style="width:100%;border-radius:10px;display:${v?'block':'none'}"></video><button class=bad>Akhiri</button></div>`;document.body.appendChild(d);let s;try{s=await navigator.mediaDevices.getUserMedia({audio:true,video:!!v});d.querySelector('video').srcObject=s}catch(e){d.querySelector('p').textContent+=' Kamera/mikrofon tidak dapat diakses.'}d.querySelector('button').onclick=()=>{s&&s.getTracks().forEach(x=>x.stop());d.remove()}}

/* ===== BANK SOAL (contoh; tambahkan hingga 100/50/50/100 soal) ===== */
const S5=['Sangat tidak setuju','Tidak setuju','Netral','Setuju','Sangat setuju'];
const sc=(q,a)=>{const s={};q.forEach((x,i)=>s[x[1]]=(s[x[1]]||0)+(+a[i]));return s};
const T={
mbti:{n:'Tes Kepribadian (MBTI)',tot:100,o:S5,b:1,q:[['Saya berenergi setelah bersosialisasi dengan banyak orang.','E'],['Saya mudah memulai percakapan dengan orang baru.','E'],['Saya perlu waktu sendiri untuk mengisi energi.','I'],['Saya lebih suka berpikir dulu sebelum berbicara.','I'],['Saya lebih percaya fakta dan pengalaman nyata.','S'],['Saya suka petunjuk yang rinci dan langkah demi langkah.','S'],['Saya sering memikirkan kemungkinan dan ide baru.','N'],['Saya tertarik melihat gambaran besar dan pola.','N'],['Saya mengambil keputusan dengan logika dan objektivitas.','T'],['Saya lebih mengutamakan kebenaran daripada kelembutan.','T'],['Saya mempertimbangkan perasaan orang lain saat memutuskan.','F'],['Menjaga keharmonisan itu penting bagi saya.','F'],['Saya suka jadwal yang rapi dan terencana.','J'],['Saya merasa lega jika tugas selesai sebelum tenggat.','J'],['Saya suka fleksibel dan mengikuti situasi.','P'],['Saya sering menunda keputusan agar tetap punya pilihan.','P']],
 res(s){const o=['EI','SN','TF','JP'].map(p=>s[p[0]]>=s[p[1]]?p[0]:p[1]).join('');return{o,say:`Tipe kecenderunganmu: ${o}. Hasil ini indikatif untuk refleksi diri, bukan diagnosis.`}}},
bm:{n:'Tes Bakat & Minat',tot:50,o:S5,b:1,q:[['Saya suka memperbaiki atau merakit sesuatu.','R'],['Saya senang bekerja dengan alat atau di luar ruangan.','R'],['Saya suka menganalisis masalah dan mencari penyebabnya.','I'],['Saya penasaran dengan sains dan penelitian.','I'],['Saya suka menggambar, menulis, atau bermusik.','A'],['Saya senang mengungkapkan ide secara kreatif.','A'],['Saya senang membantu orang lain menyelesaikan masalah.','S'],['Saya nyaman mengajar atau mendampingi teman.','S'],['Saya suka memimpin dan meyakinkan orang.','E'],['Saya tertarik pada bisnis dan berwirausaha.','E'],['Saya suka merapikan data dan dokumen.','C'],['Saya teliti dan senang mengikuti prosedur.','C']],
 res(s){const N={R:'Realistis',I:'Investigatif',A:'Artistik',S:'Sosial',E:'Enterprising',C:'Konvensional'};const o=Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>N[x[0]]).join(' + ');return{o,say:`Minat dominanmu: ${o}. Diskusikan pilihan jurusan dan karier dengan Guru BK.`}}},
cb:{n:'Tes Rekomendasi Cara Belajar',tot:50,o:S5,b:1,q:[['Saya paham lebih cepat dengan diagram, warna, atau mind map.','Visual'],['Saya mengingat apa yang saya lihat.','Visual'],['Catatan bergambar membantu saya belajar.','Visual'],['Saya paham lebih cepat lewat penjelasan lisan atau diskusi.','Auditori'],['Saya senang belajar sambil mendengarkan atau menjelaskan ulang.','Auditori'],['Membaca keras-keras membantu saya mengingat.','Auditori'],['Saya paham lebih cepat dengan praktik langsung.','Kinestetik'],['Saya sulit duduk diam lama saat belajar.','Kinestetik'],['Saya belajar sambil bergerak atau membuat model.','Kinestetik']],
 res(s){const o=Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];const tip={Visual:'Gunakan mind map, warna penanda, dan video.',Auditori:'Rekam ringkasan, diskusi kelompok, dan jelaskan ulang dengan suara.',Kinestetik:'Perbanyak praktik, simulasi, dan istirahat singkat sambil bergerak.'};return{o,say:`Gaya belajar dominan: ${o}. ${tip[o]}`}}},
mh:{n:'Mental Health Test',tot:100,o:['Tidak pernah','Beberapa hari','Lebih dari separuh waktu','Hampir setiap hari'],b:0,q:[['Dalam 2 minggu terakhir, saya merasa cemas atau gelisah.','x'],['Saya sulit berhenti mengkhawatirkan banyak hal.','x'],['Saya merasa sedih atau murung.','x'],['Saya kehilangan minat pada hal yang biasanya saya sukai.','x'],['Tidur saya terganggu.','x'],['Saya mudah lelah tanpa sebab jelas.','x'],['Saya sulit berkonsentrasi.','x'],['Saya merasa tidak berharga atau bersalah.','x'],['Saya mudah tersinggung atau marah.','x'],['Saya menarik diri dari orang lain.','x']],
 res(s){const v=s.x,m=30;let l,say;if(v<10){l='Baik';say='Kondisimu tampak cukup baik. Tetap jaga rutinitas tidur, makan, dan bersosialisasi.'}else if(v<20){l='Perlu perhatian';say='Ada tanda tekanan yang perlu diperhatikan. Pertimbangkan bercerita ke orang tepercaya atau konselor.'}else{l='Disarankan konsultasi';say='Skormu tinggi. Sebaiknya segera berkonsultasi dengan konselor atau psikolog (lihat menu Cari Konselor).'}return{o:`${v}/${m} · ${l}`,say:say+' Tes ini hanya skrining awal, bukan diagnosis. Jika kamu merasa dalam bahaya, hubungi layanan darurat setempat atau orang terdekat sekarang.'}}}};
const TESTS={siswa:['mbti','bm','cb'],klien:['mbti','mh']};

/* ===== VIEWS ===== */
const V={};
V.room=()=>{const rs=myRooms();return`<h2>Ruang Kelas <small class=mut>${rs.length}/5</small></h2><div class=card><form onsubmit="return mkRoom(this)"><div class=row><input name=n placeholder="Nama kelas, mis. XI IPA 1" required><button>Buat room</button></div></form></div>`+rs.map(r=>{const k=base()+'#join-'+r.c;return`<div class=card><div class=row><h3>${esc(r.n)}</h3><span class=sp></span><button class=ghost onclick="renRoom('${r.c}')">Edit nama</button><button class=ghost onclick="delRoom('${r.c}')">Hapus</button></div><div class=row><div class=qr data-qr="${esc(k)}"></div><div><p>Kode: <b>${r.c}</b></p><button class=ghost onclick="cp('${esc(k)}')">Salin tautan</button></div></div><div class=sc><table><tr><th>Siswa</th><th>NIS</th><th>Poin</th><th>Hasil tes</th><th></th></tr>${r.s.map(e=>D.u[e]).filter(Boolean).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.nis)}</td><td>${pts(s)}</td><td>${Object.entries(s.res||{}).map(([k,v])=>`<span class=badge title="${esc(T[k].n)}">${esc(v.o)}</span>`).join('')||'-'}</td><td><button class=ghost onclick="poin('${s.email}')">± Poin</button></td></tr>`).join('')||'<tr><td colspan=5 class=mut>Belum ada siswa bergabung.</td></tr>'}</table></div></div>`}).join('')};
V.jadwal=()=>{const st=myStudents();return`<h2>Jadwal Konseling Tatap Muka</h2><div class=card><form onsubmit="return mkSes(this)"><label>Siswa<select name=to>${st.map(s=>`<option value="${s.email}">${esc(s.name)}</option>`).join('')}</select></label><label>Waktu<input type=datetime-local name=w required></label><label>Tempat<input name=p placeholder="Ruang BK"></label><button>Simpan jadwal</button></form></div>`+D.s.filter(s=>s.o==me.email).map(s=>`<div class=card>${esc(new Date(s.w).toLocaleString('id-ID'))} · ${esc((D.u[s.to]||{}).name||'-')} · ${esc(s.p)}</div>`).join('')};
V.rekap=()=>{const r=D.r[me.room],ns=D.n.filter(n=>n.to==me.email);ns.forEach(n=>n.r=1);save();return`<h2>Rekapitulasi</h2>${r?`<p class=mut>Room: <b>${esc(r.n)}</b></p>`:'<div class="card warn">Kamu belum bergabung ke room. Buka tab Scanner.</div>'}${ns.slice(-3).map(n=>`<div class="card warn">🔔 ${esc(n.x)}</div>`).join('')}<div class=card><div class=big>${pts(me)}</div><b>poin</b><ul>${(me.log||[]).slice().reverse().map(l=>`<li><b>${l.v>0?'+':''}${l.v}</b> ${esc(l.why)} ${l.img?`<br><img src="${l.img}" alt="" style="max-width:120px;border-radius:8px">`:''}</li>`).join('')||'<li class=mut>Belum ada riwayat.</li>'}</ul></div><div class=card><h3>Gamifikasi: foto bersama</h3><p class=mut>Foto bareng teman, kakak, atau adik kelas untuk +5 poin keaktifan.</p><form onsubmit="return foto(this)"><label>Foto<input type=file name=f accept="image/*" required></label><label>Nama yang ada di foto<input name=names required></label><button>Kirim</button></form></div><div class=card><h3>Jadwal konseling</h3>${D.s.filter(s=>s.to==me.email).map(s=>`<p>${esc(new Date(s.w).toLocaleString('id-ID'))} · ${esc(s.p)}</p>`).join('')||'<p class=mut>Belum ada jadwal.</p>'}</div>`};
V.scan=()=>`<h2>Scanner</h2><div class=card><video id=cam playsinline muted style="width:100%;max-height:260px;border-radius:10px;background:#000"></video><div class=row style="margin-top:8px"><button onclick="scan()">Pindai QR</button></div></div><div class=card><form onsubmit="return manual(this)"><label>Atau tempel tautan / kode room<input name=c required></label><button>Gabung</button></form></div>`;
V.tes=()=>{if(tst)return testForm(tst);return`<h2>Asesmen Psikologis</h2>`+TESTS[me.role].map(k=>{const t=T[k],r=(me.res||{})[k];return`<div class=card><h3>${t.n}</h3><p class=mut>Contoh ${t.q.length} dari ${t.tot} soal.</p>${r?`<p><span class=badge>${esc(r.o)}</span> ${esc(r.say)}</p>`:''}<button onclick="tst='${k}';render()">${r?'Ulangi':'Mulai'}</button></div>`}).join('')};
function testForm(k){const t=T[k];return`<h2>${t.n}</h2><form onsubmit="return fin(this)">${t.q.map((q,i)=>`<fieldset><legend>${i+1}. ${esc(q[0])}</legend>${t.o.map((l,j)=>`<label class=ra><input type=radio name=q${i} value="${j+t.b}" required> ${l}</label>`).join('')}</fieldset>`).join('')}<button>Lihat hasil</button> <button type=button class=ghost onclick="tst=null;render()">Batal</button></form>`}
const card=u=>{const c=u.cs||{};return`<div class="card"><div class=row>${av(u,1)}<div><h3>${esc(u.name)}</h3><span class=badge>${R[u.role]}</span></div></div><p>${esc(c.desc||'Belum ada deskripsi.')}</p>${(u.pf||[]).length?`<p><b>Portofolio</b></p><ul>${u.pf.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class=red>Red Card · Tarif: ${esc(c.fee||'Hubungi konselor')}</div>${me.role=='klien'?`<button onclick="peer='${u.email}';go('pesan')">Chat</button>`:''}</div>`};
V.cari=()=>`<h2>Cari Konselor</h2>`+(all().filter(isCs).map(card).join('')||'<p class=mut>Belum ada konselor terdaftar.</p>');
function peers(){if(me.role=='gurubk')return myStudents().concat(me.cs&&me.cs.on?all().filter(u=>u.role=='klien'):[]);if(me.role=='siswa'){const r=D.r[me.room];return r&&D.u[r.o]?[D.u[r.o]]:[]}if(me.role=='konselor')return all().filter(u=>u.role=='klien');return all().filter(isCs)}
V.pesan=()=>{const ps=peers(),p=ps.find(x=>x.email==peer),th=p?D.m.filter(m=>(m.a==me.email&&m.b==p.email)||(m.b==me.email&&m.a==p.email)):[];return`<h2>Pesan</h2><div class=chat><aside>${ps.map(x=>`<button class="${x.email==peer?'on':''}" onclick="peer='${x.email}';render()">${av(x)} ${esc(x.name)}</button>`).join('')||'<p class=mut>Belum ada kontak.</p>'}</aside><section>${p?`<div class=row><b>${esc(p.name)}</b><span class=sp></span><button class=ghost onclick="call('${p.email}',0)">📞 Suara</button><button class=ghost onclick="call('${p.email}',1)">🎥 Video</button></div><div class=msgs>${th.map(m=>`<div class="m ${m.a==me.email?'me':''}">${esc(m.x)}</div>`).join('')||'<p class=mut>Mulai percakapan…</p>'}</div><form onsubmit="return send(this)" class=row><input name=x placeholder="Tulis pesan" required autocomplete=off><button>Kirim</button></form>`:'<p class=mut>Pilih kontak.</p>'}</section></div>`};
V.meet=()=>`<h2>Konferensi Video</h2>`+[['Buat ruang',1],['Gabung ruang',0]].map(([t,m])=>`<div class=card><form onsubmit="return meet(this,${m})"><h3>${t}</h3><label>Nama room<input name=n required></label><label>Kata sandi<input name=p type=password required></label><button>${t}</button></form></div>`).join('');
V.profil=()=>{const c=me.role=='konselor'||me.role=='gurubk',cs=me.cs||{};return`<h2>${me.role=='konselor'?'Profil Publik':'Profil'}</h2><div class=card><div class=row>${av(me,1)}<label class=btn style="margin:0">Unggah foto (opsional)<input type=file accept="image/*" hidden onchange="img(this.files[0],200,u=>{me.photo=u;save();render()})"></label>${me.photo?'<button class=ghost onclick="me.photo=\'\';save();render()">Hapus foto</button>':''}</div><form onsubmit="return saveP(this)" style="margin-top:12px"><label>Nama lengkap${c?' dan gelar':''}<input name=name value="${esc(me.name)}" required></label><p class=mut>Email: ${esc(me.email)}</p>${me.role=='siswa'?`<label>Nomor Induk<input name=nis value="${esc(me.nis)}" required></label>`:''}${c?`${me.role=='gurubk'?`<label class=chk><input type=checkbox name=on ${cs.on?'checked':''}> Aktifkan profil Konselor (layanan umum berbayar)</label>`:''}<label>Gaya / pendekatan konseling<textarea name=desc rows=3>${esc(cs.desc)}</textarea></label><label>Tarif jasa (Red Card)<input name=fee value="${esc(cs.fee)}" placeholder="Rp150.000 / sesi"></label><label>Portofolio: sertifikat, jurnal, artikel (satu per baris)<textarea name=pf rows=3>${esc((me.pf||[]).join('\n'))}</textarea></label><label>Info privat (disembunyikan dari publik)<textarea name=priv rows=2>${esc(me.priv)}</textarea></label>`:''}<button>Simpan</button></form></div>${c&&isCs(me)?`<h3>Tampilan publik</h3>${card(me)}`:''}<div class=card><button class=bad onclick="delAcc()">Hapus akun</button></div>`};

/* ===== AKSI ===== */
const go=k=>{tab=k;render()};
function out(){me=null;tab='';reg=null;L.setItem('kirana_s','');render()}
function cp(t){try{navigator.clipboard.writeText(t).then(()=>toast('Tautan disalin'),()=>toast(t))}catch(e){toast(t)}}
function step1(f){const e=f.e.value.trim().toLowerCase();if(!/^[^\s@'"<>]+@[^\s@'"<>]+\.[^\s@'"<>]+$/.test(e)){toast('Email tidak valid');return false}if(D.u[e]){enter(e)}else{reg={e};render()}return false}
function signup(f){const role=reg.role,u={email:reg.e,name:f.n.value.trim(),role,nis:f.nis?f.nis.value.trim():'',log:[],res:{},pf:[],cs:{on:role=='konselor'}};D.u[u.email]=u;save();reg=null;enter(u.email);return false}
function enter(e){me=D.u[e];L.setItem('kirana_s',e);tab='';if(pend&&me.role=='siswa'){joinRoom(pend);pend=null}render()}
function joinRoom(raw){const m=String(raw).toUpperCase().match(/JOIN-([A-Z0-9]{6})/),c=m?m[1]:String(raw).trim().toUpperCase(),r=D.r[c];if(!r){toast('Room tidak ditemukan');return}if(!r.s.includes(me.email))r.s.push(me.email);me.room=c;save();toast('Bergabung ke '+r.n);go('rekap')}
const manual=f=>{joinRoom(f.c.value);return false};
async function scan(){const v=$('#cam');try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=s;v.play();if(!('BarcodeDetector' in window)){toast('Pemindai belum didukung browser ini; pakai kode manual');return}const bd=new BarcodeDetector({formats:['qr_code']});const iv=setInterval(async()=>{try{const r=await bd.detect(v);if(r[0]){clearInterval(iv);s.getTracks().forEach(t=>t.stop());joinRoom(r[0].rawValue)}}catch(e){clearInterval(iv)}},500)}catch(e){toast('Kamera tidak tersedia; pakai kode manual')}}
function mkRoom(f){if(myRooms().length>=5){toast('Maksimal 5 room per akun');return false}let c;do{c=(Math.random().toString(36)+'000000').slice(2,8).toUpperCase()}while(D.r[c]);D.r[c]={c,n:f.n.value.trim(),o:me.email,s:[]};save();render();return false}
function renRoom(c){dlg('Ubah nama kelas',[{k:'n',l:'Nama baru',v:D.r[c].n}],v=>{D.r[c].n=v.n;save();render()})}
function delRoom(c){dlg('Hapus room',[],()=>{D.r[c].s.forEach(e=>{if(D.u[e]&&D.u[e].room==c)D.u[e].room=''});delete D.r[c];save();render()},'Room dihapus; siswa harus bergabung ulang.')}
function poin(e){dlg('Ubah poin',[{k:'v',l:'Perubahan (mis. 5 atau -10)',t:'number'},{k:'w',l:'Alasan (wajib)'}],f=>{const v=+f.v,s=D.u[e];if(!v)return;s.log.push({v,why:f.w,t:Date.now()});if(v<=-10)D.n.push({to:e,t:Date.now(),x:`Poinmu turun ${-v}: ${f.w}`});save();render();toast('Poin diperbarui')})}
function mkSes(f){if(!f.to.value)return false;D.s.push({o:me.email,to:f.to.value,w:f.w.value,p:f.p.value});save();render();return false}
function foto(f){const n=f.names.value;img(f.f.files[0],240,u=>{me.log.push({v:5,why:'Foto bersama: '+n,t:Date.now(),img:u});save();render();toast('+5 poin')});return false}
function fin(f){const t=T[tst],a=t.q.map((_,i)=>f['q'+i].value);me.res=me.res||{};me.res[tst]=t.res(sc(t.q,a));save();tst=null;render();scrollTo(0,0);return false}
function send(f){D.m.push({a:me.email,b:peer,x:f.x.value.trim(),t:Date.now()});save();render();return false}
function call(e,v){callUI((v?'Video':'Suara')+' · '+D.u[e].name,v,'Pratinjau lokal. Koneksi real-time antarperangkat membutuhkan server WebRTC.')}
function meet(f,mk){const n=f.n.value.trim(),p=f.p.value,m=D.mt[n];if(mk){if(m){toast('Nama room sudah dipakai');return false}D.mt[n]={p,h:me.email};save()}else if(!m||m.p!==p){toast('Nama room atau kata sandi salah');return false}callUI('Meeting: '+n,1,'Masuk sebagai '+me.name+'. Pratinjau lokal; koneksi multi-peserta membutuhkan server WebRTC.');return false}
function saveP(f){me.name=f.name.value.trim();if(f.nis)me.nis=f.nis.value.trim();if(f.desc){me.cs={on:me.role=='konselor'||!!(f.on&&f.on.checked),desc:f.desc.value,fee:f.fee.value};me.pf=f.pf.value.split('\n').map(x=>x.trim()).filter(Boolean);me.priv=f.priv.value}save();render();toast('Profil disimpan');return false}
function delAcc(){dlg('Hapus akun',[],()=>{const e=me.email;delete D.u[e];Object.values(D.r).forEach(r=>{if(r.o==e)delete D.r[r.c];else r.s=r.s.filter(x=>x!=e)});D.m=D.m.filter(m=>m.a!=e&&m.b!=e);D.s=D.s.filter(s=>s.o!=e&&s.to!=e);save();out()},'Akun dan datanya dihapus permanen. Kamu bebas mendaftar ulang dengan email atau nama yang sama.')}

/* ===== RENDER ===== */
function authView(){return`<div class=auth><h1>KIRANA</h1><p class=tag>Konseling Interaktif, Rekapitulasi, Asesmen, &amp; Naungan Aman</p><div class=card>${!reg?`<form onsubmit="return step1(this)"><label>Email<input type=email name=e required placeholder="nama@email.com"></label><button>Lanjut</button></form><p class=mut>Sudah punya akun? Cukup masukkan email, tanpa isi data ulang di perangkat mana pun.</p>`:!reg.role?`<p>Pilih peran untuk <b>${esc(reg.e)}</b></p><div class=roles>${Object.entries(R).map(([k,v])=>`<button onclick="reg.role='${k}';render()">${v}</button>`).join('')}</div>`:`<form onsubmit="return signup(this)"><p>${esc(reg.e)} · <b>${R[reg.role]}</b></p><label>Nama lengkap${/gurubk|konselor/.test(reg.role)?' beserta gelar':''}<input name=n required></label>${reg.role=='siswa'?'<label>Nomor Induk (NISN/NIM)<input name=nis required></label>':''}<div class=row><button>Daftar</button><button type=button class=ghost onclick="reg=null;render()">Kembali</button></div></form>`}</div></div>`}
function render(){const app=$('#app');if(!me){app.innerHTML=authView();return}const nav=NAV[me.role];if(!nav.some(x=>x[0]==tab))tab=nav[0][0];const nc=me.role=='siswa'?D.n.filter(n=>n.to==me.email&&!n.r).length:0;
app.innerHTML=`<header><b class=logo>KIRANA</b><span class=sp></span>${nc?`<button class=ghost onclick="go('rekap')">🔔 ${nc}</button>`:''}<span class=who>${av(me)}<span>${esc(me.name)}<small>${R[me.role]}</small></span></span><button class=ghost onclick="out()">Keluar</button></header><nav>${nav.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main>${V[tab]()}</main>`;
document.querySelectorAll('[data-qr]').forEach(el=>{el.innerHTML='';try{new QRCode(el,{text:el.dataset.qr,width:132,height:132})}catch(e){el.textContent='QR belum termuat'}})}
addEventListener('storage',e=>{if(e.key=='kirana'){load();if(me)me=D.u[me.email]||null;const a=document.activeElement;if(!a||a.tagName!='INPUT')render()}});
if(pend&&me&&me.role=='siswa'){joinRoom(pend);pend=null}else render();
</script></body></html>
